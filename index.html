:root[data-color="teal"][data-theme="dark"] { --bg:#0e161a; --bg-top:#101d22; --card:#1a252c; --fg:#dfe9ef; --mute:#8ca1ad; --line:#284049; --acc:#4CC2DE; --deep:#4CC2DE; --soft:#213841; --badge:#4CC2DE; --toast:#0E7490; --bar:rgba(16,29,34,0.88); --bar-fg:#dfe9ef; --card-border:#223038; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:pan-x pan-y; }
html { overscroll-behavior-y:none; touch-action:pan-x pan-y; -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--bg-top); }
body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
input, textarea { -webkit-user-select:text; user-select:text; }
[hidden] { display:none !important; }
:root { --gut:max(16px, calc((100vw - 400px) / 2)); --num:Oswald, "SUIT Variable", sans-serif; }
body { overscroll-behavior-y:none; min-height:100dvh; margin:0; padding:0 var(--gut) 90px; font:16px/1.5 var(--font-body); background:linear-gradient(180deg, var(--bg-top) 0, var(--bg) 360px) no-repeat, var(--bg); color:var(--fg); letter-spacing:-.01em; }
button { font-family:inherit; cursor:pointer; }
@font-face { font-family:Oswald; src:url(https://cdn.jsdelivr.net/npm/@fontsource-variable/oswald@5.1.1/files/oswald-latin-wght-normal.woff2) format("woff2-variations"); font-weight:200 700; font-display:block; }
@font-face { font-family:"SUIT Variable"; src:url(https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.woff2) format("woff2-variations"); font-weight:100 900; font-display:block; }

/* 상단 바 */
.top { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
  margin:0 calc(-1 * var(--gut)) 14px; padding:calc(12px + env(safe-area-inset-top, 0px)) var(--gut) 12px;
  background:var(--bg-top); color:var(--bar-fg); }
.brand { flex:1; min-width:0; padding:0; border:0; background:none; color:inherit; text-align:left; font-family:Oswald, sans-serif; font-weight:700; font-size:19px; letter-spacing:.1em; line-height:1.05; }
.icon-btn { flex:none; display:grid; place-items:center; width:36px; height:32px; padding:0; font-size:15px; line-height:1; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--acc); }
.icon-btn svg { width:18px; height:18px; }

/* 카드 */
.card { background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow); }
h3 { margin:0 0 10px; font-size:14px; font-weight:700; color:var(--mute); }
label, .lbl { display:block; margin:14px 0 6px; font-size:13px; font-weight:600; color:var(--mute); }
.hero { padding:16px 16px 14px; border-left:5px solid var(--deep); }
.ttl { display:flex; align-items:center; font-size:clamp(19px, 5.4vw, 22px); line-height:1.2; font-weight:800; letter-spacing:-.02em; color:var(--deep); }
.ttl::before { content:''; flex:none; width:10px; height:10px; margin-right:8px; border-radius:50%; background:var(--deep); }
.num { font-family:var(--num); font-variant-numeric:tabular-nums; letter-spacing:.02em; }
.dday { display:flex; align-items:flex-end; justify-content:space-between; margin-top:10px; }
.dday .big { font-family:var(--num); font-size:44px; font-weight:600; line-height:1; color:var(--fg); }
.dday .side { text-align:right; font-size:13px; font-weight:600; color:var(--mute); }
.dday .side b { display:block; font-family:var(--num); font-size:22px; font-weight:600; color:var(--fg); }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.stat { padding:10px 12px; border-radius:12px; background:var(--soft); }
.stat span { font-size:13px; font-weight:600; color:var(--mute); }
.stat b { display:block; font-family:var(--num); font-size:28px; font-weight:600; line-height:1.2; color:var(--fg); }
.bar { height:6px; margin-top:12px; border-radius:3px; background:var(--soft); overflow:hidden; }
.bar i { display:block; height:100%; border-radius:3px; background:var(--acc); transition:width .2s; }
.main { width:100%; margin-top:14px; padding:13px; font-size:16px; font-weight:700; border:0; border-radius:12px; background:var(--acc); color:#fff; box-shadow:0 4px 12px color-mix(in srgb, var(--acc) 25%, transparent); }
.sub { width:100%; margin-top:8px; padding:11px; font-size:15px; font-weight:600; border:1.5px dashed var(--line); border-radius:12px; background:none; color:var(--acc); }
.note { margin:10px 0 0; font-size:14px; color:var(--mute); }
.msg { min-height:20px; margin:8px 0 0; font-size:13px; font-weight:600; color:var(--red); text-align:center; }
.center { text-align:center; }
/* 최근 7일 · 30 Days */
.week { display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; text-align:center; font-size:12px; font-weight:600; color:var(--mute); }
.week b { display:grid; place-items:center; height:34px; margin-bottom:3px; border-radius:10px; background:var(--bg); font-family:var(--num); font-size:14px; font-weight:600; color:var(--mute); }
.week b.on { background:var(--soft); color:var(--acc); }
.week .today b { box-shadow:inset 0 0 0 1.5px var(--acc); }
.days { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; }
.days button { position:relative; aspect-ratio:1; padding:0; overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--mute); font-family:var(--num); font-size:16px; font-weight:600; }
.days button.part { background:var(--card); color:var(--fg); }
.days button.part i { position:absolute; left:0; bottom:0; height:4px; background:var(--acc); }
.days button.done { border-color:var(--acc); background:var(--acc); color:#fff; }
.days button.now { border:2px solid var(--acc); background:var(--card); color:var(--acc); }
.days button.on { border-color:var(--acc); background:var(--acc); color:#fff; }
/* 목록 */
.item { display:flex; align-items:center; gap:8px; padding:12px 0; border-top:1px solid var(--line); font-weight:600; cursor:pointer; }
.item:first-child { border-top:0; }
.item .t { flex:1; min-width:0; }
.item small { display:block; font-size:13px; font-weight:500; color:var(--mute); }
.item .r { font-size:14px; font-weight:600; color:var(--mute); }
.item .r .num { font-size:16px; color:var(--fg); }
.item::after { content:'›'; color:var(--mute); font-size:18px; }
/* 화면 머리 (하위 화면) */
.phead { display:flex; align-items:flex-end; gap:8px; margin:0 2px 10px; }
.phead .t { flex:1; min-width:0; }
.phead .pt { display:block; font-size:20px; font-weight:800; color:var(--deep); letter-spacing:-.02em; }

.phead .cnt { font-family:var(--num); font-size:16px; font-weight:600; color:var(--mute); }
/* 카드 앞면·뒷면 */
.front { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:46vh; text-align:center; cursor:pointer; }
.front .w { font-size:36px; font-weight:800; letter-spacing:-.02em; line-height:1.15; overflow-wrap:anywhere; }
.front .ph { font-size:16px; color:var(--mute); }
.front .hint { margin-top:6px; font-size:13px; font-weight:600; color:var(--mute); }
.stars { font-family:var(--num); font-size:15px; font-weight:600; letter-spacing:.15em; color:var(--orange); }
.spk { width:46px; height:46px; display:grid; place-items:center; padding:0; border:1px solid var(--line); border-radius:50%; background:var(--card); color:var(--acc); }
.spk svg { width:21px; height:21px; }
.spk.sm { width:36px; height:36px; } .spk.sm svg { width:17px; height:17px; }
.whead { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
.whead .w { flex:1; min-width:0; font-size:26px; font-weight:800; letter-spacing:-.02em; overflow-wrap:anywhere; }
.sense { padding:12px 0; border-top:1px solid var(--line); }
.sense:first-of-type { border-top:0; padding-top:6px; }
.pos { margin-right:5px; font-size:13px; font-weight:600; color:var(--mute); }
.ko { font-size:17px; font-weight:800; color:var(--deep); }
.syns { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.syns span { padding:3px 10px; font-size:14px; font-weight:600; border-radius:999px; background:var(--soft); color:var(--fg); }
.ex { margin-top:8px; font-size:15px; line-height:1.55; cursor:pointer; }
.ex b { font-weight:800; }
.ex .say { margin-left:4px; font-size:12px; font-weight:700; color:var(--acc); }
.ex .k { display:block; margin-top:2px; font-size:13px; color:var(--mute); }
.der { margin-top:12px; font-size:13px; font-weight:600; color:var(--mute); }
.tip { margin-top:12px; padding:10px 12px; border-radius:12px; background:var(--soft); font-size:13.5px; line-height:1.6; }
.tip b { display:block; margin-bottom:2px; color:var(--acc); }
.rate { position:sticky; bottom:0; z-index:5; display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; padding:10px 0 calc(6px + env(safe-area-inset-bottom, 0px)); background:var(--bg); }
.rate.two { grid-template-columns:1fr 1fr; }
.rate.one { grid-template-columns:1fr; }
.rate button { display:flex; flex-direction:column; align-items:center; padding:10px 0 8px; font-size:15px; font-weight:700; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--fg); }
.rate button span { font-family:var(--num); font-size:12px; font-weight:500; color:var(--mute); }
.rate .again { color:var(--red); }
.rate .go { border-color:var(--acc); background:var(--acc); color:#fff; box-shadow:0 4px 12px color-mix(in srgb, var(--acc) 25%, transparent); }
.rate .go span { color:#fff; opacity:.85; }
/* 퀴즈 */
.qhead { display:flex; flex-direction:column; align-items:center; gap:6px; padding:22px 0 18px; text-align:center; }
.qhead .w { font-size:32px; font-weight:800; letter-spacing:-.02em; line-height:1.2; overflow-wrap:anywhere; }
.qhead .k { font-size:22px; font-weight:800; color:var(--deep); }
.qhead .q { font-size:13px; font-weight:600; color:var(--mute); }
.opt { display:block; width:100%; margin-bottom:8px; padding:13px 14px; text-align:left; font-size:16px; font-weight:600; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--fg); }
.opt.ok { border-color:var(--acc); background:var(--soft); color:var(--acc); font-weight:800; }
.opt.no { border-color:var(--red); background:color-mix(in srgb, var(--red) 10%, var(--card)); color:var(--red); }
/* 키보드가 있는 컴퓨터(맥 앱)에서만: 버튼에 번호, 카드에 스페이스 안내 */
.kb { display:none; }
@media (hover:hover) and (pointer:fine) {
  .kb { display:block; }
  #view { counter-reset:k; }
  .rate { counter-reset:k; }
  .rate:not(.one) button, .opt { position:relative; }
  .rate:not(.one) button::before, .opt::before { counter-increment:k; content:counter(k); position:absolute; top:5px; left:8px; font:500 11px var(--num); opacity:.5; }
  .opt { padding-left:28px; }
  .front .hint::after { content:' · 스페이스'; }
}
.score { font-family:var(--num); font-size:52px; font-weight:600; line-height:1.1; color:var(--deep); }
.wd { padding:11px 0; border-top:1px solid var(--line); cursor:pointer; }
.wd:first-child { border-top:0; }
.wd .h { display:flex; align-items:baseline; gap:8px; }
.wd .n { flex:none; width:22px; font-family:var(--num); font-size:13px; color:var(--mute); }
.wd .w { font-size:16px; font-weight:800; }
.wd .new { font-size:11px; font-weight:700; color:var(--acc); }

/* 고르기 */
.seg { display:flex; gap:4px; padding:3px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
.seg button { flex:1; padding:8px 4px; font-size:15px; border:0; border-radius:8px; background:none; color:var(--mute); white-space:nowrap; }
.seg button.on { background:var(--card); color:var(--acc); font-weight:700; box-shadow:0 1px 4px color-mix(in srgb, var(--acc) 15%, transparent); }
.mini { display:flex; justify-content:flex-end; gap:12px; margin-top:6px; }
.mini button { padding:2px 0; border:0; background:none; font-size:13px; font-weight:700; color:var(--acc); }
/* 설정 시트 */
body.modal-open { overflow:hidden; }
.panel { position:fixed; inset:0; z-index:35; display:flex; align-items:flex-end; justify-content:center; background:color-mix(in srgb, color-mix(in srgb, var(--deep) 25%, #000) 48%, transparent); }
.panel .sheet { width:100%; max-width:480px; max-height:calc(100dvh - 24px - env(safe-area-inset-top, 0px)); overflow-y:auto; padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); border-radius:20px 20px 0 0; background:var(--card); box-shadow:var(--shadow); }
.panel .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.panel .head h3 { margin:0; font-size:18px; color:var(--fg); }
.panel .head button { height:34px; padding:0 16px; font-size:14px; font-weight:700; border:0; border-radius:999px; background:var(--soft); color:var(--acc); }
@media (min-width:600px) { .panel { align-items:center; } .panel .sheet { border-radius:20px; } }
.settings-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-top:1px solid var(--line); }
.settings-row:first-of-type { border-top:0; }
.settings-row b { display:block; font-size:16px; }
.settings-row p { margin:3px 0 0; font-size:13px; color:var(--mute); }
.settings-row .icon-btn { width:44px; height:40px; font-size:19px; }
.settings-row.col { flex-direction:column; align-items:stretch; }
.settings-row .pills { display:flex; gap:6px; flex:none; }
.pill { flex:none; padding:7px 14px; font-size:14px; font-weight:700; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--acc); }
.swatches { display:flex; flex-wrap:wrap; gap:10px; }
.swatches button { width:32px; height:32px; padding:0; border:3px solid var(--card); border-radius:50%; background:var(--sw); box-shadow:0 0 0 1px var(--line); }
.swatches button.on { box-shadow:0 0 0 2px var(--fg); }
input[type=date] { padding:9px 10px; font:inherit; font-family:var(--num); font-size:16px; font-weight:600; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
/* 업데이트 · 토스트 · 바닥 */
footer { margin-top:28px; }
.ver { margin:0; text-align:right; font-family:Oswald, sans-serif; font-size:11px; letter-spacing:.06em; color:var(--mute); font-variant-numeric:tabular-nums; }
.upd { position:fixed; left:var(--gut); right:var(--gut); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); z-index:35; padding:13px; font-size:15px; font-weight:700; border:0; border-radius:12px; background:var(--acc); color:#fff; box-shadow:0 6px 20px color-mix(in srgb, var(--acc) 35%, transparent); }
#toast { position:fixed; left:var(--gut); right:var(--gut); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); z-index:40; padding:13px; border-radius:12px; background:var(--toast); color:#fff; font-weight:600; text-align:center; opacity:0; transition:opacity .2s; pointer-events:none; box-shadow:0 6px 20px color-mix(in srgb, var(--acc) 30%, transparent); }
#toast.show { opacity:.97; }
</style>

  <div class="settings-row"><div><b>단어 데이터</b><p id="dataInfo"></p></div><button type="button" class="pill" data-act="pickWords">불러오기</button></div>
  <div class="settings-row"><div><b>기기 연동</b><p id="syncInfo"></p></div><button type="button" class="pill" data-act="sync" id="syncBtn">연결</button></div>
  <div class="settings-row"><div><b>진도 백업</b><p>파일로 따로 보관해요</p></div><div class="pills"><button type="button" class="pill" data-act="export">내보내기</button><button type="button" class="pill" data-act="pickBackup">복원</button></div></div>
</div></div>

  <div class="head"><h3 id="qsTitle">퀴즈</h3><button type="button" data-act="qsClose">닫기</button></div>
  <span class="lbl" style="margin-top:0">문항 수</span><div class="seg" id="qsN"></div>
  <span class="lbl">문제 유형</span><div class="seg" id="qsT"></div>

</div></div>

<script>
const APP_VERSION = '26.10.14-1';                                     // 올릴 때마다 version.json · sw.js 와 같이 올린다
document.getElementById('ver').textContent = 'v' + APP_VERSION;
const KW = 'tv.words', KS = 'tv.state';
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const $ = s => document.querySelector(s);
const V = $('#view');
let W = [], byId = {}, S = {};
let view = 'home', arg = null, sess = null, quiz = null, flipped = false, openWd = {};

/* ── 저장 ── */
const DEF_SET = { exam: '2026-11-30', newMode: 'day', auto: true, voice: '', rate: 1, test: { scope: 'learned', days: [], star: 1, type: 'syn', n: 20 },
  quick: { day: { n: 10, type: 'syn' }, review: { n: 20, type: 'syn' } } };
function fixState() {
  S.cards = S.cards || {}; S.log = S.log || {}; S.weak = S.weak || {};
  S.set = Object.assign({}, DEF_SET, S.set || {});
  S.set.test = Object.assign({}, DEF_SET.test, S.set.test || {});
  S.set.quick = Object.assign({}, DEF_SET.quick, S.set.quick || {});
}
function loadAll() {
  try { W = JSON.parse(localStorage.getItem(KW)) || []; } catch (e) { W = []; }
  try { S = JSON.parse(localStorage.getItem(KS)) || {}; } catch (e) { S = {}; }
  fixState(); byId = Object.fromEntries(W.map(w => [w.id, w]));
}
function save() {
  try { localStorage.setItem(KS, JSON.stringify(S)); }
  catch (e) { toast('저장하지 못했어요. 폰 저장 공간을 확인하세요'); }
  if (SY.code) { edits++; SY.dirty = true; saveSY(); clearTimeout(syncTimer); syncTimer = setTimeout(sync, 3000); }
}

/* ── 기기 연동: 폰·맥이 같은 진도를 쓴다. 서버(sync/Code.js)는 보관만, 합치기는 여기서 ── */
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbxccqOGEEhECaEQHd3x51VZJ6TJnHLcANqSNr1RYEiaXGUpZGG5hwtd_ndgjKnZ6oal/exec';
const KY = 'tv.sync';                                                  // { code, rev, dirty, at, err }
let SY = {}, edits = 0, syncing = null, syncTimer;
try { SY = JSON.parse(localStorage.getItem(KY)) || {}; } catch (e) {}
const saveSY = () => { try { localStorage.setItem(KY, JSON.stringify(SY)); } catch (e) {} };
const prog = x => ({ cards: x.cards || {}, log: x.log || {}, weak: x.weak || {}, wu: x.wu || 0 });   // 연동하는 것. 설정(S.set)은 기기마다 따로
const canon = o => JSON.stringify(o, (k, v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.fromEntries(Object.keys(v).sort().map(x => [x, v[x]])) : v);
// a = 이 기기, b = 서버. 카드는 더 많이 본 쪽(reps), 같으면 다음 복습일이 늦은 쪽. 날짜별 기록은 큰 값.
// 취약 단어는 나중에 바뀐 쪽 (wu 가 같으면 = 둘 다 연동 전이면 합친다)
function merge(a, b) {
  const m = Object.assign({}, a, { cards: Object.assign({}, a.cards), log: Object.assign({}, a.log) });
  for (const id in b.cards || {}) { const x = a.cards[id], y = b.cards[id]; if (!x || y.reps > x.reps || (y.reps === x.reps && y.due > x.due)) m.cards[id] = y; }
  for (const d in b.log || {}) {
    const x = a.log[d], y = b.log[d];
    m.log[d] = !x ? y : { rev: Math.max(x.rev, y.rev), nw: Math.max(x.nw, y.nw), again: Math.max(x.again, y.again), day: x.day || y.day,
      quiz: (y.quiz || []).length > (x.quiz || []).length ? y.quiz : x.quiz || [] };
  }
  const aw = a.wu || 0, bw = b.wu || 0;
  if (bw > aw) { m.weak = b.weak || {}; m.wu = bw; }
  else if (bw === aw) { m.weak = Object.assign({}, a.weak); for (const id in b.weak || {}) m.weak[id] = Math.max(b.weak[id], a.weak[id] || 0); }
  return m;
}
// 보낼 게 있으면(dirty) 마지막으로 맞춘 rev 와 함께 보낸다. 그사이 다른 기기가 올렸으면 서버 진도를 받아 합친 뒤 다시 보낸다
async function syncNow() {
  for (let i = 0; i < 4; i++) {
    const n = edits, push = SY.dirty, body = { code: SY.code, base: SY.rev || '' };
    if (push) body.state = prog(S);
    const r = await (await fetch(SYNC_URL, { method: 'POST', body: JSON.stringify(body) })).json();
    if (r.err === 'code') { SY = { err: 'code' }; throw new Error('code'); }
    if (r.err || typeof r.rev !== 'string') throw new Error('net');
    if ('state' in r) {
      if (r.state) { S = merge(S, r.state); fixState(); }
      SY.dirty = !r.state || canon(prog(S)) !== canon(prog(r.state));
      try { localStorage.setItem(KS, JSON.stringify(S)); } catch (e) {}
      if (view !== 'study' && view !== 'quiz') render();
    } else if (push && n === edits) SY.dirty = false;
    SY.rev = r.rev; SY.at = Date.now(); saveSY();
    if (!SY.dirty) return;
  }
}
function sync() {
  if (!SY.code) return Promise.resolve();
  return syncing || (syncing = syncNow().then(() => { SY.err = ''; }, e => { SY.err = e.message === 'code' ? 'code' : 'net'; })
    .finally(() => { syncing = null; saveSY(); if (!$('#settings').hidden) drawSettings(); }));
}

/* ── 날짜 ── */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => ymd(new Date());
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((toDate(b) - toDate(a)) / 864e5);
const lg = (d = today()) => S.log[d] || (S.log[d] = { rev: 0, nw: 0, again: 0, quiz: [] });

/* ── 유틸 ── */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const stars = n => n ? `<span class="stars">${'***'.slice(0, n)}</span>` : '';
const firstKo = w => (w.sen.find(s => s.ko) || {}).ko || '';
const allSyn = w => w.sen.flatMap(s => (s.syn || []).map(x => x.toLowerCase()));
const synText = w => { const s = w.sen.find(s => s.syn && s.syn.length); return s ? s.syn.slice(0, 3).join(', ') : ''; };
const stem = t => t.length > 5 ? t.slice(0, -2) : t.length > 3 ? t.slice(0, -1) : t;
function hl(en, w) {
  const safe = esc(en);
  try {
    const re = new RegExp('\\b(' + w.w.split(/\s+/).map(t => stem(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[a-z]*').join('\\s+') + ')', 'gi');
    return safe.replace(re, '<b>$1</b>');
  } catch (e) { return safe; }
}
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500); }

/* ── 발음 ── */
// 폰에 깔린 영어 목소리 중 가장 자연스러운 것: 아이폰 프리미엄 > 향상됨 > 구글(갤럭시) > 기본 사람 목소리. 장난감·옛 합성 목소리는 뺀다
const TOY = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Wobble|Fred|Good News|Jester|Junior|Kathy|Organ|Superstar|Ralph|Trinoids|Whisper|Zarvox|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)\b/;
function voiceScore(v) {
  const id = (v.name + ' ' + v.voiceURI).toLowerCase();
  return (/premium|프리미엄/.test(id) ? 100 : /enhanced|향상/.test(id) ? 80 : /google/.test(id) ? 70 : /neural|natural|online/.test(id) ? 75 : 40)
    + (v.localService === false ? 5 : 0) + (v.lang === 'en-US' ? 4 : /en[-_]GB/.test(v.lang) ? 2 : 0) + (/samantha|ava|zoe|evan|nathan|allison|susan|tom/.test(id) ? 3 : 0);
}
function voices() {
  try { return speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang) && !TOY.test(v.name)).sort((a, b) => voiceScore(b) - voiceScore(a)); }
  catch (e) { return []; }
}
function voiceFor() { const vs = voices(); return vs.find(v => v.voiceURI === S.set.voice) || vs[0] || null; }
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if (!$('#settings').hidden) drawSettings(); };
// 원어민 음성 파일: 폰 안(IndexedDB)에 통째로 보관하고, 누를 때마다 그 부분만 잘라 재생. 없으면 폰 목소리로
let AUDIO = null, audUrl = '';
const AUD = new Audio();
function idb() {
  return idb.p || (idb.p = new Promise((ok, no) => {
    const r = indexedDB.open('toefl-voca', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  }));
}
const idbDo = (mode, fn) => idb().then(db => new Promise((ok, no) => {
  const t = db.transaction('files', mode), q = fn(t.objectStore('files'));
  t.oncomplete = () => ok(q && q.result); t.onerror = () => no(t.error);
}));
idbDo('readonly', s => s.get('audio')).then(a => { if (a && a.blob) AUDIO = a; }).catch(() => {});
function play(key, text) {
  const r = AUDIO && AUDIO.idx[key];
  if (!r) return say(text);
  try {
    speechSynthesis.cancel();
    if (audUrl) URL.revokeObjectURL(audUrl);
    audUrl = URL.createObjectURL(AUDIO.blob.slice(AUDIO.base + r[0], AUDIO.base + r[0] + r[1], 'audio/aac'));
    AUD.src = audUrl; AUD.playbackRate = S.set.rate || 1;
    AUD.play().catch(() => say(text));
  } catch (e) { say(text); }
}
function say(t) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t), v = voiceFor();
    u.lang = v ? v.lang : 'en-US'; u.rate = S.set.rate || 1; if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ── 복습 간격 (SM-2, 옵시디언 Spaced Repetition 과 같은 결) ── */
// 처음 보는 카드·오늘 틀려 다시 익히는 카드(ivl 0)는 ease 를 깎지 않는다. 한 세션에 '다시'를 여러 번 누를 때마다 깎으면 그 단어 간격이 영영 짧아진다 (SM-2 의 ease hell)
function nextState(c, r) {
  const isNew = !c || !c.reps, learning = !c || !c.ivl;
  let ease = c ? c.ease : 250, ivl = c ? c.ivl : 0;
  if (r === 0) { if (!learning) ease = Math.max(130, ease - 20); ivl = 0; }
  else if (r === 1) { if (!learning) ease = Math.max(130, ease - 15); ivl = isNew ? 1 : Math.max(1, Math.round(ivl * 1.2)); }
  else if (r === 2) { ivl = isNew ? 3 : Math.max(ivl + 1, Math.round(ivl * ease / 100)); }
  else { ease += 15; ivl = isNew ? 4 : Math.max(ivl + 2, Math.round(ivl * ease / 100 * 1.3)); }
  return { ease, ivl, due: addDays(today(), ivl), reps: (c ? c.reps : 0) + 1, lapses: (c ? c.lapses || 0 : 0) + (r === 0 ? 1 : 0) };
}
const ivlLabel = n => n === 0 ? '오늘 다시' : n < 31 ? n + '일 뒤' : Math.round(n / 30) + '개월 뒤';

/* ── 오늘 분량 ── */
const unseen = () => W.filter(w => !S.cards[w.id]);
function todayDay() { const L = S.log[today()]; if (L && L.day) return L.day; const u = unseen(); return u.length ? u[0].d : null; }
const dueIds = () => { const t = today(); return W.filter(w => { const c = S.cards[w.id]; return c && c.due <= t; }).map(w => w.id); };
function newIds() {
  const u = unseen();
  if (S.set.newMode === 'day') { const d = todayDay(); return u.filter(w => w.d === d).map(w => w.id); }
  const L = S.log[today()];
  return u.slice(0, Math.max(0, +S.set.newMode - (L ? L.nw : 0))).map(w => w.id);
}
function dayStats(d) { const ws = W.filter(w => w.d === d); return { total: ws.length, seen: ws.filter(w => S.cards[w.id]).length }; }
const dayList = () => [...new Set(W.map(w => w.d))];
function streak() {
  const has = x => { const L = S.log[x]; return L && (L.rev + L.nw + (L.quiz || []).length) > 0; };
  let n = 0, d = today();
  if (!has(d)) d = addDays(d, -1);
  while (has(d)) { n++; d = addDays(d, -1); }
  return n;
}
const weakIds = () => Object.keys(S.weak).filter(id => S.weak[id] > 0 && byId[id]).sort((a, b) => S.weak[b] - S.weak[a]);
function addWeak(id, n) { S.weak[id] = Math.max(0, (S.weak[id] || 0) + n); if (!S.weak[id]) delete S.weak[id]; S.wu = Date.now(); }
const reviewDays = () => dayList().filter(n => dayStats(n).seen > 0).slice(-5);

/* ── 화면 ── */
function chrome(back) { $('#back').hidden = !back; }
function go(v, a) { view = v; arg = a; flipped = false; render(); window.scrollTo(0, 0); syncHistory(); }
const qLabel = k => { const n = S.set.quick[k].n; return n === 'all' ? '전체' : n + '문항'; };
function render() {
  if (!W.length) return renderEmpty();
  ({ home: renderHome, study: renderStudy, done: renderDone, quiz: renderQuiz, day: renderDay, weak: renderWeak, test: renderTest })[view]();
}
const phead = (title, sub, cnt) => `<div class="phead"><div class="t"><span class="pt">${esc(title)}</span>${sub ? `<span class="dt">${sub}</span>` : ''}</div>${cnt ? `<span class="cnt">${cnt}</span>` : ''}</div>`;

function renderEmpty() {
  chrome(false);
  V.innerHTML = `<div class="card hero"><div class="ttl">단어 파일을 불러오세요</div>
    <p class="note">맥에서 AirDrop 으로 보낸 <b>toefl-words.json</b> 을 고르면 30 Days 단어가 이 폰 안에 저장돼요. 인터넷에 올라가지 않아요.</p>
    <button type="button" class="main" data-act="pickWords">단어 파일 불러오기</button></div>
    <div class="card note" style="margin-top:0">진도 백업 파일이 있으면 단어를 먼저 불러온 뒤 설정에서 복원하세요.</div>`;
}

function renderHome() {
  chrome(false);
  const t = today(), due = dueIds().length, nw = newIds(), d = todayDay(), L = S.log[t] || { rev: 0, nw: 0 };
  const dd = diffDays(t, S.set.exam), done = L.rev + L.nw, left = due + nw.length;
  const pct = done + left ? Math.round(done / (done + left) * 100) : 0;
  const qd = (S.log[t] && S.log[t].day) || d;
  let h = `<div class="card hero"><div class="ttl">오늘</div>
    <div class="dday"><div><div class="big">${dd >= 0 ? 'D-' + dd : 'D+' + (-dd)}</div><span class="num" style="font-size:13px;color:var(--mute)">${esc(S.set.exam.replace(/-/g, '.'))}</span></div>
    <div class="side">연속<b>${streak()}일</b></div></div></div>`;
  h += `<div class="card"><h3>오늘 할 일 <span class="num" style="float:right">${done} 완료</span></h3>
    <div class="stats"><div class="stat"><span>복습</span><b>${due}</b></div><div class="stat"><span>신규${d && nw.length ? ' · Day ' + d : ''}</span><b>${nw.length}</b></div></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    ${left ? '<button type="button" class="main" data-act="start">학습 시작</button>' : '<p class="note center">오늘 분량 끝. 퀴즈로 마무리해요.</p>'}
    ${qd ? `<button type="button" class="sub" data-act="quizDay" data-d="${qd}">Day ${qd} 퀴즈 ${qLabel('day')}</button>` : ''}</div>`;
  h += '<div class="card"><h3>최근 7일</h3><div class="week">';
  for (let i = 6; i >= 0; i--) {
    const k = addDays(t, -i), x = S.log[k], n = x ? x.rev + x.nw : 0;
    h += `<div class="${i ? '' : 'today'}"><b class="${n ? 'on' : ''}">${n || ''}</b>${'일월화수목금토'[toDate(k).getDay()]}</div>`;
  }
  h += `</div></div><div class="card"><h3>30 Days <span class="num" style="float:right">${Object.keys(S.cards).length} / ${W.length}</span></h3><div class="days">`;
  dayList().forEach(n => {
    const s = dayStats(n);
    let cls = s.seen === s.total ? 'done' : s.seen ? 'part' : '';
    if (n === d && s.seen < s.total) cls = 'now';
    h += `<button type="button" class="${cls}" data-act="day" data-d="${n}">${n}${cls === 'part' ? `<i style="width:${Math.round(s.seen / s.total * 100)}%"></i>` : ''}</button>`;
  });
  const rd = reviewDays(), wk = weakIds().length;
  h += `</div></div><div class="card" style="padding-block:4px">
    <div class="item" data-act="test"><div class="t">단어 테스트<small>범위·문제 수·유형을 골라서</small></div></div>
    <div class="item" data-act="weak"><div class="t">취약 단어<small>퀴즈에서 틀리거나 다시 본 단어</small></div><span class="r"><span class="num">${wk}</span>개</span></div>
    ${rd.length ? `<div class="item" data-act="quizReview"><div class="t">리뷰 테스트<small>최근 5 Day · ${qLabel('review')}</small></div><span class="r num">Day ${rd[0]}${rd.length > 1 ? '-' + rd[rd.length - 1] : ''}</span></div>` : ''}
  </div>`;
  V.innerHTML = h;
}

/* ── 카드 ── */
const exHtml = (e, w) => `<div class="ex" data-say="${esc(e.en)}" data-key="e:${w.id}:${w.ex.indexOf(e)}">${hl(e.en, w)} <span class="say">듣기</span>${e.ko ? `<span class="k">${esc(e.ko)}</span>` : ''}</div>`;
function backHtml(w) {
  let h = '';
  w.sen.forEach((s, i) => {
    h += `<div class="sense"><div>${w.sen.length > 1 ? `<span class="pos num">${i + 1}.</span>` : ''}${s.p ? `<span class="pos">${esc(s.p)}</span>` : ''}<span class="ko">${esc(s.ko || '')}</span></div>
      <div class="syns">${(s.syn || []).map(x => `<span>${esc(x)}</span>`).join('')}</div>`;
    (i < w.sen.length - 1 ? w.ex.slice(i, i + 1) : w.ex.slice(i)).forEach(e => { h += exHtml(e, w); });
    h += '</div>';
  });
  if (!w.sen.length) w.ex.forEach(e => { h += exHtml(e, w); });
  if (w.der && w.der.length) h += `<div class="der">파생 ${w.der.map(esc).join(' · ')}</div>`;
  if (w.pt) h += `<div class="tip"><b>최신출제 포인트</b>${esc(w.pt)}</div>`;
  return h;
}

/* ── 학습 세션 ── */
function startSession(ids, opts) {
  if (!ids.length) return toast('볼 카드가 없어요');
  sess = Object.assign({ q: ids.slice(), done: 0, total: ids.length, again: 0, practice: false, title: '오늘 학습', back: 'home' }, opts || {});
  go('study'); speakCur();
}
const cur = () => sess && byId[sess.q[0]];
// 틀린 카드는 5~15장 뒤 아무 자리에 다시 넣는다. 늘 5번째에 넣으면 연달아 틀린 카드들이 같은 순서로 뭉쳐 돌아와 앞 카드가 답의 단서가 된다.
// 남은 카드가 5장 안이면 바로 다음 자리만 피해 섞는다
function requeue(id) {
  const n = sess.q.length, lo = n < 5 ? Math.min(1, n) : 5, hi = Math.min(15, n);
  sess.q.splice(lo + Math.floor(Math.random() * (hi - lo + 1)), 0, id);
}
function speakCur() { const w = cur(); if (w && S.set.auto) play('w:' + w.id, w.w); }
function renderStudy() {
  const w = cur();
  if (!w) return go('done');
  chrome(true);
  const c = S.cards[w.id];
  const tag = 'Day ' + w.d + (sess.practice ? '' : c ? ' · 복습' : ' · 신규');
  let h = phead(sess.title, tag, `${sess.done + 1} / ${sess.total}`) + `<div class="bar" style="margin:0 0 12px"><i style="width:${Math.round(sess.done / Math.max(1, sess.total) * 100)}%"></i></div>`;
  if (!flipped) {
    h += `<div class="card"><div class="front" data-act="flip">${stars(w.s)}<div class="w">${esc(w.w)}</div>${w.ph ? `<div class="ph">${esc(w.ph)}</div>` : ''}
      <button type="button" class="spk" data-act="say" aria-label="발음 듣기">${SPK}</button><div class="hint">카드를 누르면 뜻이 보여요</div></div></div>
      <div class="rate one"><button type="button" class="go" data-act="flip" style="padding:14px 0">뜻 보기</button></div>`;
  } else {
    h += `<div class="card"><div class="whead"><span class="w">${esc(w.w)}</span>${stars(w.s)}<button type="button" class="spk sm" data-act="say" aria-label="발음 듣기">${SPK}</button></div>${backHtml(w)}</div>`;
    if (sess.practice) h += `<div class="rate two"><button type="button" class="go" data-act="pr" data-r="1">알아요<span>넘어가기</span></button><button type="button" class="again" data-act="pr" data-r="0">모름<span>다시 보기</span></button></div>`;
    else h += '<div class="rate">' + [3, 2, 1, 0].map(r =>                 // 오른손 엄지 기준: 쉬움 · 좋음 · 어려움 · 다시
      `<button type="button" class="${r === 0 ? 'again' : r === 2 ? 'go' : ''}" data-act="rate" data-r="${r}">${['다시', '어려움', '좋음', '쉬움'][r]}<span>${ivlLabel(nextState(c, r).ivl)}</span></button>`).join('') + '</div>';
  }
  V.innerHTML = h;
}
function rate(r) {
  const w = cur(); if (!w) return;
  const c = S.cards[w.id], L = lg();
  S.cards[w.id] = nextState(c, r);
  if (!c) { L.nw++; if (S.set.newMode === 'day') L.day = w.d; } else L.rev++;
  if (r === 0) { L.again++; sess.again++; if (c) addWeak(w.id, 1); }
  else if (r >= 2 && S.weak[w.id]) addWeak(w.id, -1);
  save();
  sess.q.shift();
  if (r === 0) requeue(w.id); else sess.done++;
  flipped = false; render(); speakCur(); window.scrollTo(0, 0);
}
function practice(r) {
  const w = cur(); if (!w) return;
  sess.q.shift();
  if (r === 0) { addWeak(w.id, 1); sess.again++; requeue(w.id); }
  else { if (sess.title === '취약 단어' && S.weak[w.id]) addWeak(w.id, -1); sess.done++; }
  save(); flipped = false; render(); speakCur(); window.scrollTo(0, 0);
}
function renderDone() {
  chrome(true);
  const t = today(), L = S.log[t] || { rev: 0, nw: 0, again: 0 }, d = (S.log[t] && S.log[t].day) || todayDay();
  let h = `<div class="card hero center"><div class="ttl" style="justify-content:center">수고했어요</div><p class="note">${sess && sess.practice
    ? `다시 보기 ${sess.total}개 · 모름 ${sess.again}번` : `오늘 복습 ${L.rev} · 신규 ${L.nw} · 다시 ${L.again}`}</p></div>`;
  if (d && !(sess && sess.practice)) h += `<button type="button" class="main" data-act="quizDay" data-d="${d}">Day ${d} 퀴즈 ${qLabel('day')}</button>`;
  h += '<button type="button" class="sub" data-act="home">홈으로</button>';

}

/* ── 테스트 (퀴즈) ── */
const TYPES = { syn: '동의어 고르기', ko: '뜻 고르기', rev: '단어 고르기' };
function poolFor(t) {
  const ws = t.scope === 'weak' ? weakIds().map(id => byId[id]) : t.scope === 'days' ? W.filter(w => t.days.includes(w.d)) : W.filter(w => S.cards[w.id]);
  return ws.filter(w => (w.s || 1) >= t.star);
}
function mkQ(w, ty, src) {
  if (ty === 'syn' && !synText(w)) ty = 'ko';
  const key = ty === 'syn' ? synText : ty === 'ko' ? firstKo : x => x.w;
  const own = allSyn(w);
  const bad = o => !key(o) || key(o) === key(w) || firstKo(o) === firstKo(w) || (ty === 'syn' && allSyn(o).some(s => own.includes(s)));
  const ds = shuffle(src.filter(o => o !== w && !bad(o))).slice(0, 3);
  return { id: w.id, ty, opts: shuffle([w, ...ds]).map(o => o.id), pick: null };
}
function makeQuiz(pool, n, type, title, from) {
  const src = pool.length >= 8 ? pool : W;
  const qs = shuffle(pool.slice()).slice(0, n === 'all' ? pool.length : n)
    .map(w => mkQ(w, type === 'mix' ? ['syn', 'ko', 'rev'][Math.floor(Math.random() * 3)] : type, src));
  if (!qs.length) return toast('문제를 만들 단어가 없어요');
  quiz = { title, qs, i: 0, pool, type, n, from: from || null };
  go('quiz');
}
function optText(id, ty) { const o = byId[id]; return ty === 'syn' ? synText(o) : ty === 'ko' ? firstKo(o) : o.w; }
function renderQuiz() {
  const q = quiz.qs[quiz.i];
  if (!q) return renderQuizEnd();
  chrome(true);
  const w = byId[q.id];
  let h = phead(quiz.title, TYPES[q.ty], `${quiz.i + 1} / ${quiz.qs.length}`) + `<div class="bar" style="margin:0 0 4px"><i style="width:${Math.round(quiz.i / quiz.qs.length * 100)}%"></i></div>`;
  h += q.ty === 'rev'
    ? `<div class="qhead"><div class="k">${esc(firstKo(w))}</div><div class="q">${esc(synText(w))}</div><div class="q">알맞은 단어를 고르세요</div></div>`
    : `<div class="qhead">${stars(w.s)}<div class="w">${esc(w.w)}</div><button type="button" class="spk sm" data-act="sayW" data-id="${w.id}" data-w="${esc(w.w)}" aria-label="발음 듣기">${SPK}</button>
       <div class="q">${q.ty === 'syn' ? '같은 뜻의 동의어를 고르세요' : '알맞은 뜻을 고르세요'}</div></div>`;
  q.opts.forEach((id, k) => {
    const cls = q.pick == null ? '' : id === q.id ? 'ok' : id === q.pick ? 'no' : '';
    h += `<button type="button" class="opt ${cls}" data-act="pick" data-k="${k}">${esc(optText(id, q.ty))}</button>`;
  });
  if (q.pick != null) h += `<p class="note center">${q.pick === q.id ? '정답' : '오답'} · <b style="color:var(--fg)">${esc(w.w)}</b> <span style="color:var(--deep);font-weight:700">${esc(firstKo(w))}</span></p>
    <button type="button" class="main" data-act="qnext">${quiz.i + 1 < quiz.qs.length ? '다음' : '결과 보기'}</button>`;
  V.innerHTML = h;
}
function pick(k) {
  const q = quiz.qs[quiz.i]; if (q.pick != null) return;
  q.pick = q.opts[k];
  if (q.pick !== q.id) addWeak(q.id, 1);
  if (q.ty === 'rev') play('w:' + q.id, byId[q.id].w);
  save(); renderQuiz();
}
function renderQuizEnd() {
  chrome(true);
  const ok = quiz.qs.filter(q => q.pick === q.id).length, n = quiz.qs.length;
  if (!quiz.logged) { lg().quiz.push({ t: quiz.title, sc: ok, n }); quiz.logged = true; save(); }
  const wrong = quiz.qs.filter(q => q.pick !== q.id);
  let h = phead(quiz.title, '결과') + `<div class="card hero center"><div class="score">${ok} / ${n}</div>
    <p class="note">${ok / n < 0.6 ? '6할 미만이에요. 내일은 새 Day 대신 이 범위를 다시 보는 걸 추천해요.' : ok === n ? '전부 맞혔어요.' : '틀린 단어는 취약 단어에 들어갔어요.'}</p></div>`;
  if (wrong.length) h += `<div class="card"><h3>틀린 단어</h3>${wrong.map(q => { const w = byId[q.id];
    return `<div class="wd"><div class="h"><span class="w">${esc(w.w)}</span><span class="m">${esc(synText(w))}<br><span style="color:var(--deep)">${esc(firstKo(w))}</span></span></div></div>`; }).join('')}</div>
    <button type="button" class="main" data-act="qwrong">틀린 ${wrong.length}개만 다시</button>`;
  h += `<button type="button" class="${wrong.length ? 'sub' : 'main'}" data-act="qagain">새 문제로 다시 풀기</button><button type="button" class="sub" data-act="home">홈으로</button>`;

  const hm = t => { const d = new Date(t); return `${ymd(d) === today() ? '' : `${d.getMonth() + 1}/${d.getDate()} `}${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
  $('#syncInfo').textContent = !SY.code ? (SY.err === 'code' ? '연결 코드가 맞지 않아요' : '연결 코드를 넣으면 폰과 맥이 같은 진도를 써요')
    : syncing ? '맞추는 중' : SY.err ? '맞추지 못했어요 · 인터넷을 확인하세요' : SY.at ? '연결됨 · ' + hm(SY.at) + ' 맞춤' : '연결됨';
  $('#syncBtn').textContent = SY.code ? '지금 맞추기' : '연결';
  const ds = dayList();
  $('#dataInfo').textContent = W.length ? `${W.length}단어 · Day ${ds[0]}-${ds[ds.length - 1]}` : '아직 없음';
}
function openSettings(on) { $('#settings').hidden = !on; document.body.classList.toggle('modal-open', on); if (on) drawSettings(); syncHistory(); }

/* ── 퀴즈 시작 시트: 문항 수·유형 고르기 (Day 퀴즈·리뷰 테스트, 고른 값은 기억) ── */
let quick = null;
function openQuick(kind, d, from) {
  const days = kind === 'day' ? [d] : reviewDays();
  quick = { kind, days, from, pool: W.filter(w => days.includes(w.d)), title: kind === 'day' ? `Day ${d} 퀴즈` : '리뷰 테스트' };
  drawQuick(); $('#qsheet').hidden = false; document.body.classList.add('modal-open'); syncHistory();
}
function closeQuick() { $('#qsheet').hidden = true; document.body.classList.remove('modal-open'); render(); syncHistory(); }
function drawQuick() {
  const q = S.set.quick[quick.kind], ns = quick.kind === 'day' ? [10, 20, 30, 'all'] : [10, 20, 30, 50, 'all'], ds = quick.days;
  $('#qsTitle').textContent = quick.title;
  $('#qsN').innerHTML = ns.map(n => `<button type="button" class="${String(q.n) === String(n) ? 'on' : ''}" data-qn="${n}">${n === 'all' ? '전체' : n}</button>`).join('');
  $('#qsT').innerHTML = [['syn', '동의어'], ['ko', '뜻'], ['rev', '단어'], ['mix', '섞어서']].map(([v, l]) => `<button type="button" class="${q.type === v ? 'on' : ''}" data-qt="${v}">${l}</button>`).join('');
  const n = q.n === 'all' ? quick.pool.length : Math.min(q.n, quick.pool.length);
  $('#qsInfo').innerHTML = `${quick.kind === 'review' ? `Day ${ds[0]}${ds.length > 1 ? '-' + ds[ds.length - 1] : ''} · ` : ''}<b class="num" style="color:var(--fg)">${quick.pool.length}</b>단어 중 <b class="num" style="color:var(--fg)">${n}</b>문제`;
}
$('#qsheet').addEventListener('click', e => {
  if (e.target === e.currentTarget) return closeQuick();
  const b = e.target.closest('button'); if (!b) return;
  const q = S.set.quick[quick.kind];
  if (b.dataset.qn) { q.n = b.dataset.qn === 'all' ? 'all' : +b.dataset.qn; save(); return drawQuick(); }
  if (b.dataset.qt) { q.type = b.dataset.qt; save(); return drawQuick(); }
  if (b.dataset.act === 'qsClose') return closeQuick();
  if (b.dataset.act === 'qsGo') { $('#qsheet').hidden = true; document.body.classList.remove('modal-open'); makeQuiz(quick.pool, q.n, q.type, quick.title, quick.from); }
});

/* ── 갤럭시 뒤로 가기: 홈이 아니거나 시트가 열려 있으면 기록 한 칸을 잡아 두고, 뒤로 = 앱의 뒤로 버튼 ── */
let ignorePop = false;
function syncHistory() {
  const inner = view !== 'home' || !$('#settings').hidden || !$('#qsheet').hidden, st = history.state && history.state.inner;
  if (inner && !st) history.pushState({ inner: 1 }, '');
  else if (!inner && st) { ignorePop = true; history.back(); }
}
addEventListener('popstate', () => {
  if (ignorePop) { ignorePop = false; return; }
  if (!$('#qsheet').hidden) closeQuick();
  else if (!$('#settings').hidden) openSettings(false);
  else if (view !== 'home') $('#back').click();
  syncHistory();
});

/* ── 파일 ── */
function readFile(input, cb) {
  const f = input.files && input.files[0]; input.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { let j; try { j = JSON.parse(r.result); } catch (e) { return cb('JSON 파일이 아니에요'); } cb(null, j); };
  r.onerror = () => cb('파일을 읽지 못했어요');
  r.readAsText(f);
}
$('#fileWords').onchange = function () {
  readFile(this, (err, j) => {
    if (err) return toast(err);
    const ws = Array.isArray(j) ? j : j && j.words;
    const bad = !Array.isArray(ws) || !ws.length || ws.some(w => !w || typeof w.id !== 'string' || typeof w.w !== 'string' || typeof w.d !== 'number' || !Array.isArray(w.sen) || !Array.isArray(w.ex));
    if (bad) return toast('단어 파일 형식이 아니에요. toefl-words.json 을 골라 주세요');
    let seeded = 0;
    ws.forEach(w => { if (w.sr && !S.cards[w.id]) { S.cards[w.id] = w.sr; seeded++; } delete w.sr; w.der = w.der || []; w.pt = w.pt || ''; });
    try { localStorage.setItem(KW, JSON.stringify(ws)); } catch (e) { return toast('폰 저장 공간이 부족해서 저장하지 못했어요'); }
    W = ws; byId = Object.fromEntries(W.map(w => [w.id, w])); save();
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    openSettings(false); go('home');
    toast(`${ws.length}단어를 불러왔어요${seeded ? ` · 옵시디언 복습 기록 ${seeded}개 이어받음` : ''}`);
  });
};
$('#fileAudio').onchange = async function () {
  const f = this.files && this.files[0]; this.value = '';
  if (!f) return;
  try {
    const head = new Uint8Array(await f.slice(0, 12).arrayBuffer());
    if (String.fromCharCode(...head.slice(0, 8)) !== 'TVAUDIO1') throw new Error('음성 파일이 아니에요. toefl-audio.bin 을 골라 주세요');
    const hl = new DataView(head.buffer).getUint32(8, true);
    const meta = JSON.parse(await f.slice(12, 12 + hl).text());
    const a = { blob: f, base: 12 + hl, idx: meta.items, voice: meta.voice, count: Object.keys(meta.items).length, size: f.size };
    toast('음성 파일을 폰에 저장하는 중');
    await idbDo('readwrite', s => s.put(a, 'audio'));
    AUDIO = a; drawSettings();
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    toast(`음성 ${a.count.toLocaleString()}개를 불러왔어요 · ${a.voice}`);
  } catch (e) { toast(e.message || '음성 파일을 저장하지 못했어요'); }
};
$('#fileBackup').onchange = function () {
  readFile(this, (err, j) => {
    if (err) return toast(err);
    const st = j && j.app === 'toefl-voca' && j.state;
    if (!st || typeof st.cards !== 'object') return toast('진도 백업 파일이 아니에요');
    if (!confirm(`지금 진도를 백업 파일(${String(j.at || '').slice(0, 10)})로 덮어쓸까요?`)) return;
    S = st; fixState(); save(); drawSettings(); render(); toast('진도를 복원했어요');
  });
};
function exportBackup() {
  const data = JSON.stringify({ app: 'toefl-voca', at: new Date().toISOString(), state: S });
  const name = `toefl-progress-${today()}.json`;
  let file; try { file = new File([data], name, { type: 'application/json' }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file] }).catch(() => {});
  else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
}

/* ── 누르기 ── */
$('#back').onclick = () => {
  if (view === 'study' && sess && sess.back !== 'home') return go(sess.back, sess.backArg);
  if (view === 'quiz' && quiz && quiz.from) return go(quiz.from.v, quiz.from.a);
  go('home');
};
$('#brand').onclick = () => go('home');
$('#gear').onclick = () => openSettings(true);
$('#voiceSel').onchange = function () { S.set.voice = this.value; save(); say('exploit'); };
$('#exam').onchange = function () { if (/^\d{4}-\d\d-\d\d$/.test(this.value)) { S.set.exam = this.value; save(); render(); } };
$('#settings').addEventListener('click', e => {
  if (e.target === e.currentTarget) return openSettings(false);
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'theme') return setTheme(THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]);
  if (b.dataset.pickcolor) return setColor(b.dataset.pickcolor);
  if (b.dataset.set === 'newMode') { S.set.newMode = b.dataset.v; save(); drawSettings(); return render(); }
  if (b.dataset.set === 'auto') { S.set.auto = b.dataset.v === '1'; save(); return drawSettings(); }
  if (b.dataset.set === 'rate') { S.set.rate = +b.dataset.v; save(); drawSettings(); return play('e:1-1:0', 'Many famous writers have kept diaries to help them recall the past.'); }
  if (b.dataset.act === 'tryVoice') return say('Many famous writers have kept diaries to help them recall the past.');
  if (b.dataset.act === 'pickAudio') return $('#fileAudio').click();
  const a = b.dataset.act;
  if (a === 'closeSet') openSettings(false);
  else if (a === 'pickWords') $('#fileWords').click();
  else if (a === 'pickBackup') $('#fileBackup').click();
  else if (a === 'export') exportBackup();
  else if (a === 'sync') {
    if (!SY.code) {
      const c = (prompt('연결 코드 6자리') || '').replace(/\D/g, '');
      if (!c) return;
      try { localStorage.setItem('tv.state.before-sync', JSON.stringify(S)); } catch (e) {}   // 처음 합치기 전 진도를 한 벌 남겨 둔다
      SY = { code: c, rev: '', dirty: true }; saveSY();
    }
    const p = sync(); drawSettings();
    p.then(() => toast(SY.err === 'code' ? '연결 코드가 맞지 않아요' : SY.err ? '맞추지 못했어요. 인터넷을 확인하세요' : `맞췄어요 · 카드 ${Object.keys(S.cards).length}개`));
  }
});
V.addEventListener('click', e => {
  const ex = e.target.closest('[data-say]');
  if (ex) return play(ex.dataset.key, ex.dataset.say);
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = +el.dataset.d, t = S.set.test;
  if (a === 'noop') return;
  if (a === 'start') return startSession(shuffle(dueIds().concat(newIds())));
  if (a === 'flip') { flipped = true; renderStudy(); return window.scrollTo(0, 0); }
  if (a === 'say') { e.stopPropagation(); const w = cur(); if (w) play('w:' + w.id, w.w); return; }
  if (a === 'sayW') return play('w:' + el.dataset.id, el.dataset.w);
  if (a === 'rate') return rate(+el.dataset.r);
  if (a === 'pr') return practice(+el.dataset.r);
  if (a === 'home') return go('home');
  if (a === 'day') { openWd = {}; return go('day', d); }
  if (a === 'weak') { openWd = {}; return go('weak'); }
  if (a === 'test') return go('test');
  if (a === 'quizDay') return openQuick('day', d, view === 'day' ? { v: 'day', a: d } : null);
  if (a === 'quizReview') return openQuick('review');
  if (a === 'weakTest') return makeQuiz(weakIds().map(id => byId[id]), 20, 'syn', '취약 단어 테스트', { v: 'weak' });
  if (a === 'pick') return pick(+el.dataset.k);
  if (a === 'qnext') { quiz.i++; renderQuiz(); return window.scrollTo(0, 0); }
  if (a === 'qagain') return makeQuiz(quiz.pool, quiz.n, quiz.type, quiz.title, quiz.from);
  if (a === 'qwrong') { const ws = quiz.qs.filter(q => q.pick !== q.id).map(q => byId[q.id]); return makeQuiz(ws, 'all', quiz.type, quiz.title + ' · 틀린 것', quiz.from); }
  if (a === 'skim') return startSession(W.filter(w => w.d === d).map(w => w.id), { practice: true, title: `Day ${d} 훑어보기`, back: 'day', backArg: d });
  if (a === 'weakGo') return startSession(shuffle(weakIds()), { practice: true, title: '취약 단어', back: 'weak' });
  if (a === 'wd') { const id = el.dataset.id; openWd[id] = !openWd[id]; return render(); }
  if (a === 'pickWords') return $('#fileWords').click();
  if (a === 'tset') { const k = el.dataset.k, v = el.dataset.v; t[k] = k === 'star' ? +v : k === 'n' && v !== 'all' ? +v : v; save(); return renderTest(); }
  if (a === 'tday') { t.days = t.days.includes(d) ? t.days.filter(x => x !== d) : t.days.concat(d).sort((x, y) => x - y); save(); return renderTest(); }
  if (a === 'tdays') { t.days = el.dataset.v === 'all' ? dayList() : el.dataset.v === 'none' ? [] : dayList().filter(n => dayStats(n).seen > 0); save(); return renderTest(); }
  if (a === 'tgo') {
    const pool = poolFor(t);
    if (!pool.length) { $('#tmsg').textContent = t.scope === 'days' ? 'Day 를 하나 이상 골라 주세요' : t.scope === 'weak' ? '취약 단어가 아직 없어요' : '아직 학습한 단어가 없어요'; return; }
    const ds = t.days, run = ds.every((x, i) => !i || x === ds[i - 1] + 1);
    const label = t.scope === 'weak' ? '취약 단어' : t.scope === 'days' ? 'Day ' + (ds.length === 1 ? ds[0] : run ? `${ds[0]}-${ds[ds.length - 1]}` : ds.length <= 4 ? ds.join(', ') : `${ds.length}개`) : '학습한 단어';
    return makeQuiz(pool, t.n, t.type, `${label} 테스트`, { v: 'test' });
  }
});

/* ── 키보드 (맥 앱): 스페이스·엔터 = 뜻 보기·좋음·다음·시작, 1-9 = 화면 왼쪽(위)부터 버튼, P = 발음, Esc = 뒤로 ── */
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const sheet = !$('#qsheet').hidden ? 'q' : !$('#settings').hidden ? 's' : '';
  if (e.key === 'Escape') { if (sheet === 'q') closeQuick(); else if (sheet === 's') openSettings(false); else if (view !== 'home') $('#back').click(); return; }
  const go = e.key === ' ' || e.key === 'Enter', n = /^[1-9]$/.test(e.key) ? +e.key : 0, p = e.key.toLowerCase() === 'p';
  if (sheet === 's' || !(go || n || p)) return;
  const b = sheet === 'q' ? (go ? $('#qsheet [data-act=qsGo]') : null)
    : go ? V.querySelector('.rate .go, [data-act=qnext], button.main[data-act]')
    : n ? V.querySelectorAll('.rate button, .opt')[n - 1]
    : V.querySelector('[data-act=say], [data-act=sayW]');
  if (!b) return;
  e.preventDefault(); b.click();
});

/* 날짜가 바뀐 채로 앱을 다시 열면 홈을 새로 그린다. 앱으로 돌아오면 다른 기기 진도를 받고, 떠날 때 못 보낸 게 있으면 보낸다 */
let lastDay = today();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && today() !== lastDay) { lastDay = today(); if (view === 'home' || view === 'done') go('home'); }
  if (document.visibilityState === 'visible' || SY.dirty) sync();
});
addEventListener('focus', () => sync());

setTheme(theme); setColor(color);
loadAll(); render(); sync();

// ── 새 버전 안내: version.json 과 비교해서 다르면 버튼. 누르면 오프라인 보관본을 비우고 새로 받는다 ──
(() => {
  let latest = '';
  const check = () => fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(j => { if (j && j.version && j.version !== APP_VERSION) { latest = j.version; $('#upd').hidden = false; } })
    .catch(() => {});
  $('#upd').addEventListener('click', () => {
    $('#upd').textContent = '새로 받는 중';
    Promise.all([
      window.caches ? caches.keys().then(ks => Promise.all(ks.filter(k => k !== 'fonts-v1').map(k => caches.delete(k)))) : null,
      'serviceWorker' in navigator ? navigator.serviceWorker.getRegistration().then(r => r && r.update()) : null,
    ].map(p => Promise.resolve(p).catch(() => {}))).then(() => location.replace('./?v=' + encodeURIComponent(latest || Date.now())));
  });
  window.addEventListener('load', () => { if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {}); check(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
})();
</script>
